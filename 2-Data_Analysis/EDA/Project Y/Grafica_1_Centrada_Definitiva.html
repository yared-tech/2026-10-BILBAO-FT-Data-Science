<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Hipótesis Principal - Gráfica 1 (2 Filas)</title>
<script type="text/javascript">window.PlotlyConfig = {MathJaxConfig: 'local'};</script>
<script charset="utf-8" src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
<style>
  html, body {
    background-color: #0e1117;
    color: #f0f6fc;
    font-family: 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
  }
  .container {
    width: 94vw;
    max-width: 1450px;
    margin: 14px auto 28px auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .chart-card {
    background-color: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 10px 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.45);
  }
  .subheader-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 6px;
    padding: 0 8px;
  }
  .badge-info {
    font-size: 12.5px;
    color: #8b949e;
  }
  .selector-group {
    display: flex;
    gap: 8px;
  }
  .btn-mode {
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-mode.active {
    background: rgba(56, 139, 253, 0.2);
    color: #58a6ff;
    border-color: #58a6ff;
  }
  .plotly g.trace.bars path {
    transition: opacity 0.22s ease, filter 0.22s ease, stroke-width 0.22s ease;
  }
  .plotly g.trace.bars:hover path {
    opacity: 0.55;
  }
  .plotly g.trace.bars path:hover {
    opacity: 1.0 !important;
    filter: brightness(1.25) drop-shadow(0 0 8px rgba(88, 166, 255, 0.85));
    stroke: #ffffff !important;
    stroke-width: 2px !important;
    cursor: pointer;
  }
  .container.solo-mode {
    min-height: calc(100vh - 28px);
    justify-content: center;
    margin: 10px auto;
  }
  .chart-card.hidden-card {
    display: none !important;
  }
  .solo-controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-solo {
    background: rgba(56, 139, 253, 0.14);
    color: #58a6ff;
    border: 1px solid rgba(88, 166, 255, 0.45);
    border-radius: 6px;
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .btn-solo:hover {
    background: rgba(56, 139, 253, 0.28);
    color: #ffffff;
    border-color: #58a6ff;
  }
  .btn-solo.back-btn {
    background: rgba(234, 179, 8, 0.18);
    color: #fde047;
    border-color: #eab308;
  }
  .btn-solo.back-btn:hover {
    background: rgba(234, 179, 8, 0.32);
    color: #ffffff;
  }
  .solo-nav-pill {
    display: none;
    background: #21262d;
    color: #8b949e;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 4px 9px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .solo-nav-pill:hover {
    color: #ffffff;
    border-color: #58a6ff;
  }
  .solo-nav-pill.active-pill {
    background: rgba(56, 139, 253, 0.22);
    color: #58a6ff;
    border-color: #58a6ff;
  }
  .container.solo-mode .solo-nav-pill,
  .main-wrapper.solo-mode .solo-nav-pill {
    display: inline-block;
  }
</style>
</head>
<body>
  <div class="container" id="main_container">
    <!-- FILA 1: Los 160 primeros (Escandinavia en TableS6) -->
    <div class="chart-card" id="card_0">
      <div class="subheader-bar">
        <span class="badge-info">
          🧬 <b>Muestra Principal Escandinavia (n=160):</b> Individuos enterrados en Dinamarca, Suecia y Noruega con perfil ChromoPainter completo.
        </span>
        <div class="solo-controls">
          <button class="solo-nav-pill active-pill" onclick="toggleSolo(0)">1A</button>
          <button class="solo-nav-pill" onclick="toggleSolo(1)">1B</button>
          <button id="solo_btn_0" class="btn-solo" onclick="toggleSolo(0)">🔍 Ver sola a pantalla completa</button>
        </div>
      </div>
      <div id="grafica1_top" class="plotly-graph-div" style="height:420px; width:100%;"></div>
    </div>

    <!-- FILA 2: Los siguientes (Peor trazabilidad n=226 / Resto ChromoPainter n=129) -->

      <div class="subheader-bar">
        <span class="badge-info">

        <div class="selector-group" style="align-items:center; flex-wrap:wrap;">
          <button id="btn_low_cov" class="btn-mode active" onclick="renderBottomChart('low_cov')">

          </button>
          <button id="btn_rest_cp" class="btn-mode" onclick="renderBottomChart('rest_cp')">
            Restantes con ChromoPainter fuera de Escandinavia (n=129)
          </button>
          <div class="solo-controls" style="margin-left:4px;">
            <button class="solo-nav-pill" onclick="toggleSolo(0)">1A</button>
            <button class="solo-nav-pill active-pill" onclick="toggleSolo(1)">1B</button>
            <button id="solo_btn_1" class="btn-solo" onclick="toggleSolo(1)">🔍 Ver sola a pantalla completa</button>
          </div>
        </div>
      </div>
      <div id="grafica1_bottom" class="plotly-graph-div" style="height:420px; width:100%;"></div>
    </div>
  </div>

  <script type="text/javascript">

    const xRest129Full = [30.1,23.5,9.7,56.1,59.6,89.6,55.8,51.2,82.1,52.0,47.2,39.7,98.9,91.0,22.9,77.0,16.1,30.1,46.9,50.8,61.9,77.7,19.4,81.4,62.8,77.7,83.6,100.0,2.5,65.3,8.5,17.2,0.0,21.1,47.3,19.6,10.5,61.4,51.0,29.6,45.6,16.7,55.2,33.2,43.1,97.1,91.7,97.4,41.9,69.5,99.9,86.7,42.3,50.0,21.5,88.4,34.4,44.4,50.8,46.0,63.9,64.5,66.2,55.8,50.0,61.4,47.8,68.2,63.2,53.5,53.2,35.6,42.5,24.7,45.0,0.0,12.2,6.4,26.6,14.7,14.5,0.6,13.6,34.9,13.2,17.3,44.7,11.0,29.1,10.4,38.7,11.2,10.8,16.8,24.7,34.3,3.3,13.3,0.0,7.0,98.2,98.6,99.5,98.9,96.8,34.3,31.9,99.8,99.7,42.6,16.4,90.4,0.8,30.9,19.2,1.8,14.4,24.7,17.1,49.0,29.0,69.2,47.6,12.0,14.0,14.0,15.0,31.0,19.0];

    const xLowCov226 = [0.095, 0.082, 0.162, 0.228, 0.522, 0.773, 0.629, 0.496, 0.177, 0.122, 0.325, 0.188, 0.248, 0.571, 0.375, 0.938, 0.164, 0.454, 0.112, 0.49, 0.62, 0.803, 0.214, 0.786, 0.187, 0.874, 0.514, 0.779, 0.174, 0.004, 0.274, 0.003, 0.006, 0.027, 0.007, 0.32, 0.341, 0.144, 0.735, 0.866, 0.117, 0.16, 0.005, 0.231, 0.198, 0.003, 0.041, 0.64, 0.011, 0.39, 0.556, 0.016, 0.159, 0.822, 0.043, 0.008, 0.068, 0.272, 0.961, 0.978, 0.039, 0.362, 0.023, 0.019, 0.002, 0.902, 0.11, 0.939, 0.906, 0.892, 0.009, 0.01, 0.535, 0.003, 0.813, 0.906, 0.057, 0.03, 0.048, 0.046, 0.018, 0.01, 0.703, 0.065, 0.045, 0.1, 0.339, 0.116, 0.131, 0.067, 0.031, 0.138, 0.582, 0.001, 0.35, 0.219, 0.594, 0.041, 0.544, 0.053, 0.316, 0.707, 0.027, 0.727, 0.774, 0.595, 0.537, 0.045, 0.076, 0.043, 0.003, 0.008, 0.522, 0.074, 0.904, 0.991, 0.75, 0.056, 0.155, 0.071, 0.039, 0.197, 0.448, 0.118, 0.664, 0.335, 0.439, 0.659, 0.809, 0.499, 0.825, 0.805, 0.1, 0.57, 0.458, 0.667, 0.398, 0.508, 0.731, 0.011, 0.305, 0.363, 0.315, 0.297, 0.584, 0.003, 0.562, 0.593, 0.554, 0.565, 0.013, 0.633, 0.983, 0.015, 0.671, 0.006, 0.64, 0.764, 0.674, 0.656, 0.07, 0.106, 0.06, 0.044, 0.975, 0.424, 0.735, 0.233, 0.165, 0.168, 0.129, 0.019, 0.027, 0.93, 0.013, 0.135, 0.119, 0.118, 0.111, 0.18, 0.178, 0.25, 0.304, 0.257, 0.058, 0.023, 0.215, 0.161, 0.071, 0.032, 0.793, 0.121, 0.228, 0.166, 0.246, 0.188, 0.18, 0.189, 0.288, 0.273, 0.087, 0.268, 0.082, 0.123, 0.011, 0.225, 0.027, 0.215, 0.064, 0.117, 0.866, 0.709, 0.901, 0.946, 0.164, 0.859, 0.823, 0.636, 0.438, 0.217, 0.965, 0.882, 0.094, 0.933, 0.126, 0.103];

    const baseLayout = {
      font: { color: "#f2f5fa", family: "Segoe UI, Roboto, sans-serif" },
      paper_bgcolor: "#161b22",
      plot_bgcolor: "#161b22",
      margin: { t: 65, b: 50, l: 60, r: 40 },
      hoverlabel: { font: { size: 13 }, bgcolor: "#1f2937", bordercolor: "#58a6ff" },
      height: 420

    Plotly.newPlot("grafica1_top", [{
      hovertemplate: "<b>Rango % Foráneo:</b> %{x}%<br><b>Nº Individuos:</b> %{y}<extra>Escandinavia (n=160)</extra>",
      marker: { color: "#00d4ff", line: { color: "#ffffff", width: 1.5 } },
      opacity: 0.85,
      x: xScand160,
      xbins: { end: 100, size: 5.5, start: 0 },

      title: { text: "<b>1A. Hipótesis Principal: Distribución de Ascendencia Foránea en Escandinavia (n=160)</b>", y: 0.94, x: 0.03 },
      xaxis: {
        title: { text: "% de Ascendencia No Escandinava (UK + Sur Europa + Eslavo + Finés)" },
        gridcolor: "#283442", linecolor: "#506784", zerolinecolor: "#283442"

      yaxis: {

      shapes: [

        { type: "rect", x0: 30, x1: 104.5, xref: "x", y0: 0, y1: 1, yref: "y domain", fillcolor: "#ff3366", opacity: 0.12, line: { width: 0 } }
      ],
      annotations: [
        { x: 30, y: 0.96, xref: "x", yref: "y domain", xanchor: "right", yanchor: "top", text: "<b>Superan el 30%: 56.9% (n=91/160)</b>", showarrow: false, font: { size: 13, color: "#ffccd5" } }
      ]
    }, { responsive: true });

    var currentSolo = null;
    const plotIds = ["grafica1_top", "grafica1_bottom"];

    function renderBottomChart(mode) {
      document.getElementById("btn_low_cov").classList.toggle("active", mode === "low_cov");
      document.getElementById("btn_rest_cp").classList.toggle("active", mode === "rest_cp");

      if (mode === "low_cov") {
        const curH = (typeof currentSolo !== "undefined" && currentSolo === 1) ? Math.max(480, Math.min(680, window.innerHeight - 110)) : 420;
        Plotly.react("grafica1_bottom", [{
          hovertemplate: "<b>Profundidad Cobertura (AvgDepth):</b> %{x}x<br><b>Nº Individuos:</b> %{y}<extra>Peor Trazabilidad (n=226)</extra>",
          marker: { color: "#f59e0b", line: { color: "#ffffff", width: 1.5 } },
          opacity: 0.85,
          x: xLowCov226,
          xbins: { end: 1.0, size: 0.055, start: 0 },
          type: "histogram"
        }], {
          ...baseLayout, height: curH,
          title: { text: "<b>1B. Individuos Siguientes con Peor Trazabilidad Genómica (Cobertura AvgDepth &lt; 1.0x, n=226 | Excluidos &lt; 0.5x, n=153)</b>", y: 0.94, x: 0.03 },

            title: { text: "Profundidad Media de Cobertura Genómica - AvgDepth (X)" },
            gridcolor: "#283442", linecolor: "#506784", zerolinecolor: "#283442"
          },

          ]

          opacity: 0.85,
          x: xRest129Full,
          xbins: { end: 100, size: 5.5, start: 0 },
          type: "histogram"
        }], {

          title: { text: "<b>1B. Resto de Individuos con Trazabilidad fuera de Escandinavia (Diáspora Vikinga, n=129)</b>", y: 0.94, x: 0.03 },

    renderBottomChart("low_cov");


    function toggleSolo(idx) {
      const container = document.getElementById("main_container");
      if (currentSolo === idx || idx === null) {
        currentSolo = null;
        container.classList.remove("solo-mode");
        [0, 1].forEach(i => {
          document.getElementById("card_" + i).classList.remove("hidden-card");
          const btn = document.getElementById("solo_btn_" + i);
          btn.innerHTML = "🔍 Ver sola a pantalla completa";
          btn.classList.remove("back-btn");
          const plotEl = document.getElementById(plotIds[i]);
          plotEl.style.height = "420px";
          Plotly.relayout(plotIds[i], { height: 420 });
        });
      } else {
        currentSolo = idx;
        container.classList.add("solo-mode");
        const soloH = Math.max(480, Math.min(680, window.innerHeight - 110));
        [0, 1].forEach(i => {
          const card = document.getElementById("card_" + i);
          const btn = document.getElementById("solo_btn_" + i);
          if (i === idx) {
            card.classList.remove("hidden-card");
            btn.innerHTML = "🔙 Volver a ver todas (ESC)";
            btn.classList.add("back-btn");
            const plotEl = document.getElementById(plotIds[i]);
            plotEl.style.height = soloH + "px";
            Plotly.relayout(plotIds[i], { height: soloH });
          } else {
            card.classList.add("hidden-card");
          }
        });
        window.scrollTo({ top: 0, behavior: "instant" });
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && currentSolo !== null) {
        e.preventDefault();
        toggleSolo(null);
      }
    });

</body>
</html>
